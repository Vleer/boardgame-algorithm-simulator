[package]
name = "tictactoe-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Debian/bookworm wasm-opt (binaryen ≤108) breaks wasm-bindgen's externref table.
# Use --no-opt / wasm-opt = false until binaryen ≥119 is available in the image.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
